services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: turtle
      POSTGRES_USER: turtle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ml-service/migrations/001_scale_platform.sql:/docker-entrypoint-initdb.d/001_scale_platform.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turtle -d turtle"]
      interval: 10s
      timeout: 5s
      retries: 10

  embedding:
    build:
      context: .
      dockerfile: embedding-service/Dockerfile
    environment:
      EMBEDDING_SERVICE_API_KEY: ${EMBEDDING_SERVICE_API_KEY:?set EMBEDDING_SERVICE_API_KEY}
      ALLOWED_IMAGE_DOMAINS: ${ALLOWED_IMAGE_DOMAINS:?set ALLOWED_IMAGE_DOMAINS}
      FASHION_MODEL_ID: ${FASHION_MODEL_ID:-patrickjohncyh/fashion-clip}
    volumes:
      - model-cache:/models/cache
      - ./models/fashion-clip:/models/fashion-clip:ro

  api:
    build: {context: ., dockerfile: ml-service/Dockerfile.scale}
    env_file: ${SCALE_ENV_FILE:-ml-service/.env.scale}
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      embedding: {condition: service_started}
    volumes: ["./models:/models:ro"]

  worker:
    build: {context: ., dockerfile: ml-service/Dockerfile.scale}
    command: ["python", "worker.py"]
    env_file: ${SCALE_ENV_FILE:-ml-service/.env.scale}
    depends_on:
      postgres: {condition: service_healthy}
      embedding: {condition: service_started}
    volumes: ["./models:/models:ro"]

volumes:
  postgres-data:
  model-cache:
