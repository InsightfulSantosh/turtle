[project]
name = "turtle-season-intelligence-backend"
version = "3.0.0"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
]

[project.scripts]
turtle-prepare-data = "data_pipeline.prepare_real_data:main"
turtle-index-fashion = "fashion_matching.index_catalog:main"
turtle-match-fashion = "fashion_matching.match:main"
turtle-evaluate-fashion = "fashion_matching.evaluation:main"

[project.optional-dependencies]
fashion-matching = [
  "ftfy>=6.3,<7",
  "httpx>=0.28,<1",
  "open-clip-torch>=3.2,<4",
  "Pillow>=11,<12",
  "faiss-cpu>=1.8,<2; platform_system != 'Darwin'",
  "qdrant-client>=1.14,<2",
  "torch>=2.7,<3",
  "transformers>=4.52,<5",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
