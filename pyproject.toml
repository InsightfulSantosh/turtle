[project]
name = "turtle-season-intelligence-backend"
version = "3.0.0"
requires-python = ">=3.12"
# Dependencies are declared in requirements.txt at the repository root — the
# single source of truth, installed with `uv pip install -r requirements.txt`.
dependencies = []

[project.scripts]
turtle-prepare-data = "data_pipeline.prepare_real_data:main"
turtle-index-fashion = "fashion_matching.index_catalog:main"
turtle-match-fashion = "fashion_matching.match:main"
turtle-evaluate-fashion = "fashion_matching.evaluation:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# The backend packages live under backend/src, which ruff cannot infer from the
# project root; without this it sorts them as third-party and interleaves them
# with real third-party imports such as PIL.
[tool.ruff.lint.isort]
known-first-party = ["core", "data_pipeline", "fashion_matching", "machine_learning"]
