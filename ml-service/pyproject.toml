[project]
name = "turtle-season-intelligence"
version = "2.4.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.139.0",
  "numpy>=2.0,<3",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.6,<2",
  "uvicorn[standard]==0.51.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
